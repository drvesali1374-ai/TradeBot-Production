<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - اتوماسیون هوشمند</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .metallic-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(10px);
        }
        .text-gradient {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: white;
            width: 100%;
            transition: all 0.3s;
        }
        .input-field:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="w-full max-w-md mx-auto p-4">
        <div class="metallic-card rounded-2xl p-8">
            <!-- Logo/Title -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full glass-effect mb-4">
                    <i class="fas fa-chart-line text-3xl text-purple-400"></i>
                </div>
                <h1 class="text-2xl font-bold text-gradient mb-2">اتوماسیون هوشمند</h1>
                <p class="text-gray-400 text-sm">سیستم تحلیل تکنیکال معاملات</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-2">
                        <i class="fas fa-user ml-1"></i>
                        نام کاربری
                    </label>
                    <input type="text" id="username" class="input-field" placeholder="نام کاربری خود را وارد کنید" required autocomplete="username">
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-2">
                        <i class="fas fa-lock ml-1"></i>
                        رمز عبور
                    </label>
                    <input type="password" id="password" class="input-field" placeholder="رمز عبور خود را وارد کنید" required autocomplete="current-password">
                </div>
                <div id="error-message" class="text-red-400 text-sm text-center hidden">
                    <i class="fas fa-exclamation-circle ml-1"></i>
                    <span id="error-text"></span>
                </div>
                <button type="submit" id="login-btn" class="btn-primary">
                    <i class="fas fa-sign-in-alt ml-2"></i>
                    ورود
                </button>
            </form>

            <!-- Loading indicator -->
            <div id="loading" class="text-center hidden">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-purple-500"></div>
                <p class="text-gray-400 mt-2 text-sm">در حال ورود...</p>
            </div>

            <!-- Footer -->
            <div class="text-center mt-6 text-gray-500 text-xs">
                <p>پیش‌فرض: admin / admin</p>
                <p class="mt-1">پس از ورود، رمز را از تنظیمات تغییر دهید</p>
            </div>
        </div>
    </div>

    <script>
        // Redirect to main page if already logged in
        fetch('/api/auth/verify').then(r => {
            if (r.ok) {
                window.location.href = '/home.html';
            }
        }).catch(() => {});

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const loginBtn = document.getElementById('login-btn');
            const loading = document.getElementById('loading');

            // Hide error, show loading
            errorDiv.classList.add('hidden');
            loginBtn.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = '/home.html';
                } else {
                    errorText.textContent = data.error || 'ورود ناموفق بود';
                    errorDiv.classList.remove('hidden');
                    loginBtn.classList.remove('hidden');
                    loading.classList.add('hidden');
                }
            } catch (err) {
                errorText.textContent = 'خطا در ارتباط با سرور';
                errorDiv.classList.remove('hidden');
                loginBtn.classList.remove('hidden');
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
