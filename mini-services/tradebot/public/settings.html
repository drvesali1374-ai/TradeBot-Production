<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیمات - اتوماسیون هوشمند</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .text-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .form-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .sticky-buttons {
            position: sticky;
            top: 64px;
            z-index: 40;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-white">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 glass-effect">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-reverse space-x-6">
                    <a href="index.html" class="text-white hover:text-purple-400 transition-colors duration-200">
                        <i class="fas fa-home ml-1"></i>
                        خانه
                    </a>
                    <a href="settings.html" class="text-purple-400 transition-colors duration-200">
                        <i class="fas fa-cog ml-1"></i>
                        تنظیمات
                    </a>
                    <a href="market_signal.html" class="text-white hover:text-purple-400 transition-colors duration-200">
                        <i class="fas fa-chart-line ml-1"></i>
                        داشبورد
                    </a>
                    <a href="trading.html" class="text-white hover:text-purple-400 transition-colors duration-200">
                        <i class="fas fa-exchange-alt ml-1"></i>
                        خرید و فروش
                    </a>
                    <a href="automation.html" class="text-white hover:text-purple-400 transition-colors duration-200">
                        <i class="fas fa-robot ml-1"></i>
                        اتوماسیون
                    </a>
                </div>
                <div class="flex items-center">
                    <div class="text-2xl font-bold text-gradient">
                        اتوماسیون هوشمند
                        <i class="fas fa-robot mr-2"></i>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sticky Action Buttons -->
    <div class="sticky-buttons py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-center space-x-reverse space-x-4">
                <button id="save-settings" class="glass-effect px-6 py-2 rounded-lg hover:bg-purple-600 transition-all duration-300">
                    <i class="fas fa-save ml-2"></i>
                    ذخیره تنظیمات
                </button>
                <button id="reset-settings" class="glass-effect px-6 py-2 rounded-lg hover:bg-red-600 transition-all duration-300">
                    <i class="fas fa-undo ml-2"></i>
                    بازنشانی پیش‌فرض
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="pt-32 pb-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- Header -->
            <div class="text-center mb-12">
                <h1 class="text-4xl font-bold text-gradient mb-4">
                    <i class="fas fa-cog ml-3"></i>
                    تنظیمات سیستم
                </h1>
            </div>

            <!-- Settings Form -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Basic Settings -->
                <div class="glass-effect rounded-2xl p-6">
                    <h2 class="text-2xl font-semibold mb-6 text-gradient">
                        <i class="fas fa-sliders-h ml-2"></i>
                        تنظیمات پایه
                    </h2>
                    
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium mb-2">
                                <i class="fas fa-coins ml-1"></i>
                                نام نماد معاملاتی
                            </label>
                            <input type="text" id="symbol-name" class="form-input w-full px-4 py-3 rounded-lg" 
                                   placeholder="مثلا: DOT" value="DOT">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2">
                                <i class="fas fa-clock ml-1"></i>
                                تایم فریم
                            </label>
                            <select id="interval" class="form-input w-full px-4 py-3 rounded-lg">
                                <option value="1h" selected>۱ ساعته</option>
                                <option value="30m">۳۰ دقیقه</option>
                                <option value="15m">۱۵ دقیقه</option>
                                <option value="4h">۴ ساعته</option>
                                <option value="1d">۱ روزه</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2">
                                <i class="fas fa-list-ol ml-1"></i>
                                تعداد داده‌ها
                            </label>
                            <input type="number" id="limit" class="form-input w-full px-4 py-3 rounded-lg" 
                                   value="1000" min="100" max="2000">
                        </div>
                    </div>
                </div>

                <!-- Signal Settings -->
                <div class="glass-effect rounded-2xl p-6">
                    <h2 class="text-2xl font-semibold mb-6 text-gradient">
                        <i class="fas fa-signal ml-2"></i>
                        پارامترهای سیگنال
                    </h2>
                    
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium mb-2">
                                <i class="fas fa-history ml-1"></i>
                                دوره برگشت (LookBack)
                            </label>
                            <input type="number" id="lookback" class="form-input w-full px-4 py-3 rounded-lg" 
                                   value="50" min="10" max="200">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2">
                                <i class="fas fa-chart-bar ml-1"></i>
                                ضریب حجم معاملات
                            </label>
                            <input type="number" id="vol-mult" class="form-input w-full px-4 py-3 rounded-lg" 
                                   value="0.2" step="0.1" min="0.1" max="2">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2">
                                <i class="fas fa-calculator ml-1"></i>
                                دوره میانگین حجم
                            </label>
                            <input type="number" id="avg-vol-period" class="form-input w-full px-4 py-3 rounded-lg" 
                                   value="50" min="10" max="200">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2">
                                <i class="fas fa-crosshairs ml-1"></i>
                                آستانه RSI
                            </label>
                            <input type="number" id="rsi-threshold" class="form-input w-full px-4 py-3 rounded-lg" 
                                   value="50" min="0" max="100">
                        </div>
                    </div>
                </div>

                <!-- Technical Indicators -->
                <div class="glass-effect rounded-2xl p-6">
                    <h2 class="text-2xl font-semibold mb-6 text-gradient">
                        <i class="fas fa-chart-area ml-2"></i>
                        اندیکاتورهای تکنیکال
                    </h2>
                    
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium mb-2">
                                <i class="fas fa-wave-square ml-1"></i>
                                دوره RSI
                            </label>
                            <input type="number" id="rsi-period" class="form-input w-full px-4 py-3 rounded-lg" 
                                   value="14" min="5" max="50">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2">
                                <i class="fas fa-arrows-alt-h ml-1"></i>
                                دوره ATR
                            </label>
                            <input type="number" id="atr-period" class="form-input w-full px-4 py-3 rounded-lg" 
                                   value="14" min="5" max="50">
                        </div>
                    </div>
                </div>

                <!-- Risk Management -->
                <div class="glass-effect rounded-2xl p-6">
                    <h2 class="text-2xl font-semibold mb-6 text-gradient">
                        <i class="fas fa-shield-alt ml-2"></i>
                        مدیریت ریسک
                    </h2>
                    
                    <div class="space-y-6">
                        <!-- Long Position Settings -->
                        <div class="border border-gray-600 rounded-lg p-4">
                            <h3 class="text-lg font-medium mb-4 text-blue-400">
                                <i class="fas fa-arrow-up ml-1"></i>
                                پوزیشن Long
                            </h3>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium mb-2">ضریب TP</label>
                                    <input type="number" id="tp-long-mult" class="form-input w-full px-3 py-2 rounded-lg" 
                                           value="20" min="1" max="100">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-2">ضریب SL</label>
                                    <input type="number" id="sl-long-mult" class="form-input w-full px-3 py-2 rounded-lg" 
                                           value="6" min="1" max="50">
                                </div>
                            </div>
                            
                            <div class="mt-4">
                                <label class="block text-sm font-medium mb-2">TP ثابت (%)</label>
                                <input type="number" id="long-fixed-tp" class="form-input w-full px-3 py-2 rounded-lg" 
                                       placeholder="خالی برای ATR-based" min="0.1" max="50" step="0.1">
                            </div>
                            
                            <div class="mt-4">
                                <label class="block text-sm font-medium mb-2">SL ثابت (%)</label>
                                <input type="number" id="long-fixed-sl" class="form-input w-full px-3 py-2 rounded-lg" 
                                       placeholder="خالی برای ATR-based" min="0.1" max="50" step="0.1">
                            </div>
                        </div>
                        
                        <!-- Short Position Settings -->
                        <div class="border border-gray-600 rounded-lg p-4">
                            <h3 class="text-lg font-medium mb-4 text-red-400">
                                <i class="fas fa-arrow-down ml-1"></i>
                                پوزیشن Short
                            </h3>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium mb-2">ضریب TP</label>
                                    <input type="number" id="tp-short-mult" class="form-input w-full px-3 py-2 rounded-lg" 
                                           value="24" min="1" max="100">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-2">ضریب SL</label>
                                    <input type="number" id="sl-short-mult" class="form-input w-full px-3 py-2 rounded-lg" 
                                           value="4" min="1" max="50">
                                </div>
                            </div>
                            
                            <div class="mt-4">
                                <label class="block text-sm font-medium mb-2">TP ثابت (%)</label>
                                <input type="number" id="short-fixed-tp" class="form-input w-full px-3 py-2 rounded-lg" 
                                       placeholder="خالی برای ATR-based" min="0.1" max="50" step="0.1">
                            </div>
                            
                            <div class="mt-4">
                                <label class="block text-sm font-medium mb-2">SL ثابت (%)</label>
                                <input type="number" id="short-fixed-sl" class="form-input w-full px-3 py-2 rounded-lg" 
                                       placeholder="مثلا: 6" min="0.1" max="50" step="0.1">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- API Credentials -->
                <div class="glass-effect rounded-2xl p-6 lg:col-span-2">
                    <h2 class="text-2xl font-semibold mb-6 text-gradient">
                        <i class="fas fa-key ml-2"></i>
                        تنظیمات API
                    </h2>
                    
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium mb-2">
                                <i class="fas fa-key ml-1"></i>
                                API Key
                            </label>
                            <input type="text" id="api-key" class="form-input w-full px-4 py-3 rounded-lg" 
                                   placeholder="کلید API صرافی را وارد کنید" value="X8eeI84g9PrhgxmfCqilP9GR8gTWy9TEyfh2vG8DoTGOXwxDSwqqh2zusT69429j">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2">
                                <i class="fas fa-lock ml-1"></i>
                                Secret Key
                            </label>
                            <input type="text" id="secret-key" class="form-input w-full px-4 py-3 rounded-lg" 
                                   placeholder="کلید مخفی صرافی را وارد کنید" value="CimriVFjSdI7POG4B4pzNRxsxZNrhltDnRwq95vshhtZFyjnW2JVrX6pcH8v9z6H">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2">
                                <i class="fas fa-link ml-1"></i>
                                Exchange Base URL
                            </label>
                            <input type="text" id="base-url" class="form-input w-full px-4 py-3 rounded-lg" 
                                   placeholder="آدرس پایه API صرافی" value="https://api.toobit.com">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center">
                <div class="text-2xl font-bold text-gradient mb-4">
                    <i class="fas fa-robot ml-2"></i>
                    اتوماسیون هوشمند
                </div>
                <p class="text-gray-400 mb-6">سیستم تحلیل تکنیکال پیشرفته</p>
                <div class="text-gray-500">
                    © 2025 اتوماسیون هوشمند. تمام حقوق محفوظ است.
                </div>
            </div>
        </div>
    </footer>

    <script>
        class SettingsManager {
            constructor() {
                this.loadSettings();
                this.bindEvents();
            }

            getDefaultSettings() {
                return {
                    symbolName: 'DOT',
                    interval: '1h',
                    limit: 1000,
                    lookback: 50,
                    volMult: 0.2,
                    avgVolPeriod: 50,
                    rsiThreshold: 50,
                    rsiPeriod: 14,
                    atrPeriod: 14,
                    tpLongMult: 20,
                    slLongMult: 6,
                    tpShortMult: 24,
                    slShortMult: 4,
                    longFixedTp: null,
                    longFixedSl: null,
                    shortFixedTp: null,
                    shortFixedSl: 6,
                    apiKey: '',
                    secretKey: '',
                    baseUrl: 'https://api.toobit.com'
                };
            }

            loadSettings() {
                const saved = localStorage.getItem('marketSignalSettings');
                const settings = saved ? JSON.parse(saved) : this.getDefaultSettings();
                
                // Apply settings to form
                Object.keys(settings).forEach(key => {
                    const element = document.getElementById(key.replace(/([A-Z])/g, '-$1').toLowerCase());
                    if (element) {
                        if (settings[key] === null || settings[key] === '') {
                            element.value = '';
                        } else {
                            element.value = settings[key];
                        }
                    }
                });
            }

            saveSettings() {
                const settings = {};
                const inputs = document.querySelectorAll('input, select');
                
                inputs.forEach(input => {
                    const key = input.id.replace(/-([a-z])/g, (g) => g[1].toUpperCase());
                    if (input.type === 'number') {
                        settings[key] = input.value === '' ? null : parseFloat(input.value);
                    } else {
                        // تبدیل نماد به حروف بزرگ قبل از ذخیره
                        if (key === 'symbolName') {
                            settings[key] = input.value.toUpperCase();
                        } else {
                            settings[key] = input.value;
                        }
                    }
                });
                
                localStorage.setItem('marketSignalSettings', JSON.stringify(settings));
                
                // Show success message
                this.showNotification('تنظیمات با موفقیت ذخیره شد!', 'success');
            }

            resetSettings() {
                if (confirm('آیا مطمئن هستید که می‌خواهید تنظیمات را به حالت پیش‌فرض بازنشانی کنید؟')) {
                    localStorage.removeItem('marketSignalSettings');
                    this.loadSettings();
                    this.showNotification('تنظیمات به حالت پیش‌فرض بازنشانی شد.', 'info');
                }
            }

            showNotification(message, type = 'success') {
                const notification = document.createElement('div');
                notification.className = `fixed top-32 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-lg glass-effect ${
                    type === 'success' ? 'text-green-400' : 'text-blue-400'
                }`;
                notification.innerHTML = `
                    <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'} ml-2"></i>
                    ${message}
                `;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }

            bindEvents() {
                document.getElementById('save-settings').addEventListener('click', () => {
                    this.saveSettings();
                });
                
                document.getElementById('reset-settings').addEventListener('click', () => {
                    this.resetSettings();
                });
                
                // تبدیل خودکار نماد به حروف بزرگ در حین تایپ
                const symbolInput = document.getElementById('symbol-name');
                symbolInput.addEventListener('input', (e) => {
                    const cursorPosition = e.target.selectionStart;
                    e.target.value = e.target.value.toUpperCase();
                    e.target.setSelectionRange(cursorPosition, cursorPosition);
                });
            }
        }

        // Initialize settings manager
        const settingsManager = new SettingsManager();
    </script>
</body>
</html>
